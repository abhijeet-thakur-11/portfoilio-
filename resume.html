<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhijeet Thakur — Resume / Curriculum Vitae</title>
    <meta name="description" content="Curriculum Vitae of Abhijeet Thakur — Intelligent Systems Engineer & AI Scholar.">

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=block" rel="stylesheet">

    <style>
        :root {
            --color-latte: #FFF8E7;
            --color-latte-card: #FFFDF5;
            --color-mocha: #C8A98B;
            --color-mocha-light: #DEC9B5;
            --color-mocha-dark: #A58161;
            --color-burgundy: #5C0A1E;
            --color-burgundy-dark: #3F0514;
            --font-sub: 'Raleway', sans-serif;
            --font-body: 'Montserrat Alternates', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-mocha-light);
            color: var(--color-burgundy);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        /* Top Floating Navigation */
        .resume-page-nav {
            width: 100%;
            max-width: 980px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: rgba(255, 248, 231, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(92, 10, 30, 0.14);
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(92, 10, 30, 0.12);
            margin-bottom: 16px;
            gap: 12px;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-sub);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--color-burgundy);
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .nav-back:hover {
            transform: translateX(-2px);
        }

        .nav-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-sub);
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--color-burgundy);
        }

        .nav-title span {
            color: var(--color-mocha-dark);
            font-weight: 600;
            font-size: 0.78rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            font-family: var(--font-sub);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 9999px;
            transition: all 0.15s ease;
            line-height: 1;
            cursor: pointer;
        }

        .btn-dl {
            background-color: var(--color-burgundy);
            color: var(--color-latte);
            border: 1px solid var(--color-burgundy);
            box-shadow: 0 4px 12px rgba(92, 10, 30, 0.2);
        }

        .btn-dl:hover {
            background-color: var(--color-burgundy-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(92, 10, 30, 0.3);
        }

        .btn-ghost {
            background-color: transparent;
            color: var(--color-burgundy);
            border: 1px solid rgba(92, 10, 30, 0.22);
        }

        .btn-ghost:hover {
            background-color: rgba(92, 10, 30, 0.06);
            border-color: var(--color-burgundy);
        }

        /* Paper Document Sheet */
        .resume-sheet-wrap {
            width: 100%;
            max-width: 980px;
            flex: 1;
            height: calc(100vh - 90px);
            min-height: 600px;
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid rgba(92, 10, 30, 0.1);
            box-shadow: 0 25px 60px -15px rgba(92, 10, 30, 0.2), 0 8px 24px -6px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .resume-sheet-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            background: #F8F6F0;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .resume-page-nav {
                border-radius: 10px;
                padding: 8px 12px;
                margin-bottom: 8px;
            }

            .nav-title span {
                display: none;
            }

            .btn-pill {
                padding: 6px 10px;
                font-size: 0.65rem;
            }

            .resume-sheet-wrap {
                height: calc(100vh - 70px);
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>
    <nav class="resume-page-nav">
        <a href="index.html" class="nav-back">
            <span>←</span> Back to Portfolio
        </a>

        <div class="nav-title">
            Abhijeet Thakur <span>// Resume</span>
        </div>

        <div class="nav-actions">
            <a href="Abhijeet_Thakur_Resume.pdf" download="Abhijeet_Thakur_Resume.pdf" class="btn-pill btn-dl" title="Download to device">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Download PDF</span>
            </a>
            <a href="Abhijeet_Thakur_Resume.pdf" target="_blank" class="btn-pill btn-ghost" title="Open full PDF file">
                <span>Direct PDF ↗</span>
            </a>
        </div>
    </nav>

    <div class="resume-sheet-wrap">
        <iframe src="Abhijeet_Thakur_Resume.pdf#toolbar=0&navpanes=0&view=FitH" title="Abhijeet Thakur Resume PDF"></iframe>
    </div>
</body>

</html>
